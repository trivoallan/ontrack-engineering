name: ci

# The pull request gate of ADR-0011 (forge.gate: blocking): one job, `test`,
# that the ruleset in .github/rulesets/main.json makes required on main.
# Adding a step to the job changes no GitHub setting; adding a job would.
# pull_request only, never pull_request_target (ADR-0011): forks and
# Dependabot run it with a read-only token and no secret. No push trigger:
# the ruleset makes every commit on main arrive through a pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ADR-0006 step lints every commit after origin/<base>, so the
          # base branch and the whole history down to it must be present.
          fetch-depth: 0
          # No step pushes or fetches: the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24, as release.yml. setup-node's default npm cache is kept:
          # this job publishes nothing.
          node-version: 24
      # ADR-0020: npm 12 blocks dependency install scripts, refuses Git
      # dependencies and honours .npmrc's min-release-age; Node 24 ships npm
      # 11, which runs scripts anyway. Exact version, and nothing updates it
      # (Dependabot reads no run: line): drop this step once the Node version
      # above ships npm 12.
      - run: npm install --global npm@12.2.2 # zizmor: ignore[adhoc-packages] npm itself, exact version, no lockfile can hold it
      # ADR-0025 (tools.manager: mise): gitleaks and zizmor at the versions
      # mise.toml pins, checked against mise.lock (the action passes --locked
      # when the lockfile is there). The tests drive the pre-commit hook, which
      # runs that gitleaks. mise's own version is written here and nothing
      # updates it: keep it at mise.toml's min_version.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.8
      # ADR-0020: install from package-lock.json without resolving again; a
      # lockfile out of date with package.json fails here, and so does any
      # install script not named in package.json's allowScripts. The tests
      # spawn commitlint, a devDependency.
      - run: npm ci --strict-allow-scripts
      # package.json "test": tsc --noEmit, then node --test on checks/*.test.ts.
      - run: npm test
      # ADR-0006: the pull request's commits are Conventional Commits with a
      # scope from commits.scopes. Runs the checkout's script, not the copy
      # under node_modules, so a pull request changing the check is checked
      # by its own version; Node strips its types. GitHub's merge commit is
      # ignored by commitlint.
      # Skipped on pull requests authored by Dependabot (a departure declared
      # in ADR-0006): its commit bodies start with a `Bumps [name](url)` line
      # past commitlint's 100-character limit, while its titles, which the
      # squash keeps, are `chore: bump ...` (.github/dependabot.yml). The
      # author, not the actor, so a person's pull request is always checked.
      # Install and tests above still run and `test` still reports.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        # The base branch name reaches the shell through env, not through a
        # template expanded into the script (template injection).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node checks/ontrack-engineering-check.ts ADR-0006 --from "origin/$BASE_REF"
      # ADR-0009: the pull request's head branch is <prefix>/<description> with
      # a prefix from branching.prefixes. The script reads it from
      # GITHUB_HEAD_REF, as the checkout is detached. The checkout's script, as
      # above, so the tool-branch exemption (release-please--, dependabot/, ...)
      # is the one in this pull request, not the older pinned copy. Not skipped
      # for Dependabot: its branches are exempt in the check itself.
      - run: node checks/ontrack-engineering-check.ts ADR-0009
      # ADR-0016: the configured schema, openspec's validation, and no change
      # left in openspec/changes/ with every task checked (revision 3: a
      # change is archived in the pull request that checks its last task).
      # The checkout's script, as above; openspec comes from node_modules.
      - run: node checks/ontrack-engineering-check.ts ADR-0016
      # For the reviewer (change add-pr-change-summary, #88): each active
      # OpenSpec change the pull request touches, with a per-requirement diff
      # of its deltas against the current specs, in this job's summary. A
      # summary, not a PR comment, so the token stays read-only (ADR-0011).
      # Three-dot diff: against the merge base, so changes merged on main
      # since the branch started are left out. A change the pull request
      # archives (ADR-0016) is shown too, from its archive directory: its
      # proposal and its spec deltas, as openspec show reads active changes
      # only. --no-renames, or git reports the moved files as renames and the
      # added-file filter misses them. Never fails `test`, and runs even when
      # a step above failed.
      - if: always()
        continue-on-error: true
        run: |
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- openspec/changes \
            | cut -d/ -f3 | { grep -vx archive || true; } | sort -u \
            | while read -r change; do
                [ -d "openspec/changes/$change" ] || continue
                # The proposal is Markdown and renders as is; from openspec's
                # "Specifications Changed" line on, the output is a diff,
                # fenced so the summary keeps its +/- lines. Under MODIFIED
                # only, lines lose the four spaces openspec indents them by, so
                # GitHub colours the hunk; ADDED text keeps them, or its
                # "- **WHEN**" lines would show as removals.
                {
                  echo "## Change \`$change\`"
                  npx --no-install openspec show "$change" --type change --diff --no-interactive \
                    | awk '/^Specifications Changed/ { print; print "```diff"; fenced = 1; next } /^  [A-Z]+: / { modified = /^  MODIFIED: / } fenced && modified { sub(/^    /, "") } { print } END { if (fenced) print "```" }'
                } >> "$GITHUB_STEP_SUMMARY"
              done
          git diff --name-only --no-renames --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" -- openspec/changes/archive \
            | cut -d/ -f4 | sort -u \
            | while read -r change; do
                dir="openspec/changes/archive/$change"
                [ -f "$dir/proposal.md" ] || continue
                {
                  echo "## Change \`$change\` (archived)"
                  cat "$dir/proposal.md"
                  find "$dir/specs" -name spec.md 2>/dev/null | sort | while read -r delta; do
                    echo
                    echo "### \`${delta#"$dir/"}\`"
                    echo '````markdown'
                    cat "$delta"
                    echo '````'
                  done
                } >> "$GITHUB_STEP_SUMMARY"
              done
