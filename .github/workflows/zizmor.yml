name: zizmor

# Workflow audit of ADR-0011 (forge.audit: zizmor): zizmor reads the workflows
# for what the ADR's rules forbid, on every pull request, with its online
# audits. A finding fails the job. It is silenced only inline, on its line,
# with its reason (`# zizmor: ignore[audit] why`), never in a zizmor.yml.
# The job is named `zizmor`: that is the check the main ruleset requires.
# No paths: filter, so every pull request reports it.
on:
  pull_request:

# Reading the code, and GitHub's API for the online audits. No secret, so a
# pull request from a fork runs it too.
permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-0025 (tools.manager: mise): zizmor at the version mise.toml pins,
      # checked against mise.lock's checksum (the action passes --locked when
      # the lockfile is there). Only zizmor is installed. mise's own version
      # is written here and nothing updates it: keep it at mise.toml's
      # min_version, as ci.yml does.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.8
          install_args: zizmor
      # The files ADR-0011 names, the ones `ontrack check` audits offline,
      # here with the online audits, which read GitHub's API with the job's
      # token. --no-config: a finding is silenced only inline. Findings fail
      # the job and show as annotations; no SARIF upload, which would need
      # security-events: write, which a fork's token lacks.
      - run: zizmor --no-config --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
