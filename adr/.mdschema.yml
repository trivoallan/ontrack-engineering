# yaml-language-server: $schema=https://raw.githubusercontent.com/jackchuka/mdschema/main/schema.json
#
# Schema for the ontrack-engineering ADRs once a repository has RULED on them.
#
# It checks that an ADR carries its ruling: status decided, date set, no
# trait key left empty, Nygard sections present, and the how-to-rule block
# gone. A convention exactly as this package ships it FAILS this schema, on
# purpose: it is still `proposed` and its traits are empty. Only ADR-0001,
# which ships `accepted`, passes it inside ontrack-engineering itself. There is no
# second schema for shipped conventions: two schemas drift, so review is the check
# on ontrack-engineering's side.
#
# `ontrack-engineering-check ADR-0001` runs it, through ADR-0001's `check:` line, with
# `mdschema check --schema <this file>` on the ruled copies: no copy, no
# discovery from the current directory.
#
# Trait keys are `optional`: an ABSENT key passes, so a `rejected` ADR with
# no `traits:` block passes. A key that is PRESENT but empty is refused and
# named. Four keys are exceptions: the language overrides of ADR-0002
# (`documentation`, `commits`, `code`, `comments`) may be empty, which means
# "same as `default`". `default` itself may not be empty.
frontmatter:
  fields:
    - { name: "adr", type: string }
    - { name: "slug", type: string }
    - { name: "title", type: string }
    - { name: "status", enum: [accepted, rejected] }
    - { name: "revision", type: number }
    - { name: "date", format: date }
    - { name: "authors", type: array }
    - { name: "supersedes", type: array }
    - { name: "traits", type: object, optional: true }
    # ADR-0001
    - { name: "traits.record-architecture-decisions.format", enum: [nygard], optional: true }
    # ADR-0002
    - { name: "traits.localization.language.default", enum: [french, english], optional: true }
    - { name: "traits.localization.language.documentation", enum: [french, english, null], optional: true }
    - { name: "traits.localization.language.commits", enum: [french, english, null], optional: true }
    - { name: "traits.localization.language.code", enum: [french, english, null], optional: true }
    - { name: "traits.localization.language.comments", enum: [french, english, null], optional: true }
    # ADR-0003
    - { name: "traits.architecture.pattern", enum: [event-driven, hexagonal, layered, microservices, monolithic, soa], optional: true }
    # ADR-0010
    - { name: "traits.architecture.document", enum: [arc42, elsewhere, none], optional: true }
    - { name: "traits.architecture.model", type: string, optional: true }
    - { name: "traits.architecture.diagrams", enum: [mermaid, plantuml, none], optional: true }
    # ADR-0004
    - { name: "traits.languages.main.name", type: string, optional: true }
    # ADR-0005
    - { name: "traits.validation.boundary", type: string, optional: true }
    - { name: "traits.validation.data_files", type: string, optional: true }
    # ADR-0006
    - { name: "traits.commits.scopes", type: array, optional: true }
    - { name: "traits.commits.tool", enum: [commitlint, hook, none], optional: true }
    # ADR-0007
    - { name: "traits.tests.coverage_target", optional: true }
    # ADR-0008
    - { name: "traits.docs.tool", enum: [starlight, docusaurus, mkdocs, none], optional: true }
    - { name: "traits.docs.root", type: string, optional: true }
    - { name: "traits.docs.audience", enum: [single-user, team, public], optional: true }
    - { name: "traits.docs.channels", type: array, optional: true }
    # ADR-0009
    - { name: "traits.branching.model", enum: [github-flow, trunk-based, gitflow], optional: true }
    - { name: "traits.branching.merge", enum: [squash, merge-commit, rebase], optional: true }
    - { name: "traits.branching.prefixes", type: array, optional: true }
    # ADR-0011
    - { name: "traits.forge.gate", enum: [blocking, informative, none], optional: true }
    - { name: "traits.forge.audit", type: string, optional: true }
    - { name: "traits.forge.integration", enum: [queue, up-to-date, none], optional: true }
    # ADR-0012
    - { name: "traits.delivery.target", enum: [container, platform, package, none], optional: true }
    - { name: "traits.delivery.environments", type: array, optional: true }
    - { name: "traits.delivery.release_tool", type: string, optional: true }
    - { name: "traits.delivery.release_notes", enum: [changelog, highlights, none], optional: true }
    - { name: "traits.delivery.registry", type: string, optional: true }
    - { name: "traits.deployment.manifests", type: string, optional: true }
    # ADR-0013
    - { name: "traits.frontend.framework", type: string, optional: true }
    # ADR-0014
    - { name: "traits.tracking.tool", enum: [github-issues, linear, jira, none], optional: true }
    - { name: "traits.tracking.project", type: string, optional: true }
    # ADR-0015
    - { name: "traits.secrets.storage", type: string, optional: true }
    - { name: "traits.secrets.guard", type: string, optional: true }
    # ADR-0016
    - { name: "traits.changes.framework", enum: [openspec, none], optional: true }
    - { name: "traits.changes.schema", type: string, optional: true }
    # ADR-0017
    - { name: "traits.agent.hosts", type: array, optional: true }
    # ADR-0018
    - { name: "traits.dependencies.updater", enum: [dependabot, renovate, none], optional: true }
    - { name: "traits.dependencies.automerge", enum: [none, patch, minor], optional: true }
    # ADR-0019
    - { name: "traits.vulnerabilities.sbom", enum: [cyclonedx, spdx, none], optional: true }
    - { name: "traits.vulnerabilities.scanner", type: string, optional: true }
    - { name: "traits.vulnerabilities.fail_on", enum: [critical, high, medium, low, none], optional: true }
    # ADR-0020
    - { name: "traits.admission.approver", enum: [person, agent], optional: true }
    - { name: "traits.admission.install_scripts", enum: [ignored, allowed], optional: true }
    # ADR-0021
    - { name: "traits.supply_chain.build_level", enum: [0, 1, 2, 3], optional: true }
    # ADR-0022
    - { name: "traits.review.by", enum: [maintainer, peer, agent], optional: true }
    - { name: "traits.review.approvals", type: number, optional: true }
    # ADR-0023
    - { name: "traits.license.spdx", type: string, optional: true }
    # ADR-0024
    - { name: "traits.code_scanning.tool", type: string, optional: true }
    - { name: "traits.code_scanning.fail_on", enum: [critical, high, medium, low, none], optional: true }
    # ADR-0025
    - { name: "traits.tools.manager", enum: [mise, aqua, script, none], optional: true }
    # ADR-0026
    - { name: "traits.agent.identity", enum: [maintainer, own], optional: true }
    # ADR-0027
    - { name: "traits.infrastructure.tool", type: string, optional: true }
    - { name: "traits.infrastructure.source", type: string, optional: true }
    - { name: "traits.infrastructure.state", type: string, optional: true }
    - { name: "traits.infrastructure.apply", enum: [manual, merge], optional: true }
structure:
  - heading:
      pattern: "^# .+"
    children:
      - heading: "## Status"
      - heading: "## Context"
      - heading: "## Decision"
        forbidden_text: ["Everything below disappears when you rule"]
      - heading: "## Consequences"
        children:
          - heading: "### Positive"
          - heading: "### Negative"
          - heading: "### Neutral"
      - heading: "## Alternatives Considered"
        allow_additional: true
      - heading: "## References"
